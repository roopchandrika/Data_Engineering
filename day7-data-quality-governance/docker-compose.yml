services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    build: .
    image: airflow-gx:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__FERNET_KEY: "Add your FERNET key"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/dags:/opt/airflow/dags"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/gx_scripts:/opt/airflow/gx_scripts"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/transactions.csv:/opt/airflow/data/transactions.csv"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/great_expectations:/opt/airflow/great_expectations"

    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --role Admin \
          --firstname Admin \
          --lastname User \
          --email admin@example.com

  airflow-webserver:
    build: .
    image: airflow-gx:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__FERNET_KEY: gpJ+SyQl3C4qvLanLu1eX4dKRuPjaUAZpNDP1WExukw=
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/dags:/opt/airflow/dags"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/gx_scripts:/opt/airflow/gx_scripts"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/transactions.csv:/opt/airflow/data/transactions.csv"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/great_expectations:/opt/airflow/great_expectations"


    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    build: .
    image: airflow-gx:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__FERNET_KEY: gpJ+SyQl3C4qvLanLu1eX4dKRuPjaUAZpNDP1WExukw=
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/dags:/opt/airflow/dags"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/gx_scripts:/opt/airflow/gx_scripts"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/transactions.csv:/opt/airflow/data/transactions.csv"
      - "C:/Users/mrcha/Desktop/docker/ELT/day7-data-quality-governance/great_expectations:/opt/airflow/great_expectations"


    command: scheduler

